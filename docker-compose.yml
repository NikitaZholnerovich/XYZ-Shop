services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: xyz-shop-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - xyz_shop_mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: XYZ-shop/XYZ-shop.Web/Dockerfile
    container_name: xyz-shop-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "80:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultDbConnection: "Server=db,1433;Database=XYZ-project;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER:-XYZ-shop}
      Jwt__Audience: ${JWT_AUDIENCE:-XYZ-shop}
      Jwt__ExpireMinutes: ${JWT_EXPIRE_MINUTES:-60}
      RAWG__ApiKey: ${RAWG_API_KEY}

volumes:
  xyz_shop_mssql_data:
